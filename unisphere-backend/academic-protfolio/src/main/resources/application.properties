spring.application.name=portfolio

server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/unisphere_portfolio?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=osloCC@123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File upload configuration - increased for video uploads
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

file.upload-dir=uploads

spring.web.resources.static-locations=file:uploads/

# Logging configuration
logging.level.com.unisphere.portfolio=DEBUG
logging.level.org.springframework.web=INFO

