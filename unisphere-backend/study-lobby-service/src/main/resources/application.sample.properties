#Create application.properties file and copy this file into that application.properties with your details
# Server
server.port=8085

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/study_lobby_db
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
spring.application.name=study-lobby-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

